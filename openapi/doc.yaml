openapi: 3.1.0
info:
  title: Assistant Kernel API documentation
  description: This is the official documentation of the assistant kernel API.
  version: 1.0.0
servers:
  - url: 'http://localhost:50500'
tags:
  - name: chat
    description: Endpoints to prompt an AI model and manage messages.
  - name: models
    description: Endpoints to manage AI models.
  - name: conversations
    description: Endpoints to manage conversations.
paths:
  /chat:
    post:
      tags: [chat]
      summary: Post a new chat to get an AI response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prompt"
      responses:
        "200":
          description: AI responded in the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          description: A bad request was made.
        "404":
          description: The conversation or the model was not found.
        "500":
          description: An server error occurred while treating the request.

  /models:
    get:
      tags: [models]
      summary: Get a list of the AI models present on the system.
      responses:
        "200":
          description: A list of AI models on the system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArray"
        "500":
          description: An server error occurred while treating the request.

  /conversation:
    get:
      tags: [conversations]
      summary: Get a list of saved conversations.
      responses:
        "200":
          description: A list of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationArray"
        "500":
          description: An server error occurred while treating the request.
  /conversation/{id}:
    get:
      tags: [conversations]
      summary: Get all the messages in a conversation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A list of messages in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageArray"
        "400":
          description: A bad request was made.
        "404":
          description: Conversation does not exist.
        "500":
          description: An server error occurred while treating the request.
    delete:
      tags: [ conversations ]
      summary: Delete a whole conversation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Conversation was deleted.
        "400":
          description: A bad request was made.
        "404":
          description: Conversation does not exist.
        "500":
          description: An server error occurred while treating the request.

components:
  schemas:
    Prompt:
      type: object
      properties:
        model:
          type: string
        message:
          type: string
        conversationId:
          type: integer

    Answer:
      type: object
      properties:
        conversationId:
          type: integer
        message:
          type: string
        conversationTokenCount:
          type: integer

    ModelArray:
      type: array
      items:
        $ref: "#/components/schemas/Model"

    Model:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        size:
          type: number

    ConversationArray:
      type: array
      items:
        $ref: "#/components/schemas/Conversation"

    Conversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

    MessageArray:
      type: array
      items:
        $ref: "#/components/schemas/Message"

    Message:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
