openapi: 3.1.0
info:
  title: Assistant Kernel API documentation
  description: This is the official documentation of the assistant kernel API.
  version: 1.0.0
servers:
  - url: 'http://localhost:50500'
tags:
  - name: chat
    description: Endpoints to prompt an AI model and manage messages.
  - name: models
    description: Endpoints to manage AI models.
  - name: conversations
    description: Endpoints to manage conversations.
paths:
  /chat:
    post:
      tags: [ chat ]
      summary: Post a new chat to get an AI response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prompt"
            example:
              model: "llama3.2"
              message: "What is the meaning of life?"
              conversationId: -1
      responses:
        "200":
          description: AI responded in the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
              example:
                conversationId: 1
                message: "42"
                conversationTokenCount: 150
        "400":
          description: A bad request was made.
        "404":
          description: The conversation or the model was not found.
        "500":
          description: A server error occurred while treating the request.

  /models:
    get:
      tags: [ models ]
      summary: Get a list of the AI models present on the system.
      responses:
        "200":
          description: A list of AI models on the system.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArray"
              example:
                - name: "llama3.2"
                  model: "llama3.2"
                  size: 2.12
        "500":
          description: A server error occurred while treating the request.

  /conversation:
    get:
      tags: [ conversations ]
      summary: Get a list of saved conversations.
      responses:
        "200":
          description: A list of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationArray"
              example:
                - id: 1
                  title: "Meaning of life"
                - id: 2
                  title: "Go programming help"
        "500":
          description: A server error occurred while treating the request.

  /conversation/{id}:
    get:
      tags: [ conversations ]
      summary: Get all the messages in a conversation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A list of messages in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageArray"
              example:
                - role: "user"
                  content: "Hello"
                - role: "assistant"
                  content: "Hi there!"
        "400":
          description: A bad request was made.
        "404":
          description: Conversation does not exist.
        "500":
          description: A server error occurred while treating the request.
    delete:
      tags: [ conversations ]
      summary: Delete a whole conversation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Conversation was deleted.
        "400":
          description: A bad request was made.
        "404":
          description: Conversation does not exist.
        "500":
          description: A server error occurred while treating the request.

  /conversation/{id}/summarize:
    post:
      tags: [ conversations ]
      summary: Make a summary of a conversation to save tokens.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelOnly"
            example:
              name: "llama3.2"
      responses:
        "200":
          description: A summary was created for the conversation.
        "400":
          description: A bad request was made.
        "404":
          description: Conversation does not exist.
        "500":
          description: A server error occurred while treating the request.

components:
  schemas:
    Prompt:
      type: object
      required:
        - model
        - message
      properties:
        model:
          type: string
          description: The name of the Ollama model to use.
          example: "llama3.2"
        message:
          type: string
          description: The user prompt to send to the AI.
          example: "What is the meaning of life?"
        conversationId:
          type: integer
          description: Existing conversation ID, or -1 to create a new conversation.
          minimum: -1
          example: -1

    Answer:
      type: object
      properties:
        conversationId:
          type: integer
          description: The ID of the conversation this response belongs to.
        message:
          type: string
          description: The AI-generated answer text.
        conversationTokenCount:
          type: integer
          description: Total token count (prompt + response).

    ModelArray:
      type: array
      items:
        $ref: "#/components/schemas/Model"

    Model:
      type: object
      properties:
        name:
          type: string
          description: Human-readable model name.
        model:
          type: string
          description: Underlying model identifier.
        size:
          type: number
          description: Approximate model size in gigabytes.

    ModelOnly:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the Ollama model to use.
          example: "llama3.2"

    ConversationArray:
      type: array
      items:
        $ref: "#/components/schemas/Conversation"

    Conversation:
      type: object
      properties:
        id:
          type: integer
          description: Unique conversation identifier.
        title:
          type: string
          description: Auto-generated conversation title.

    MessageArray:
      type: array
      items:
        $ref: "#/components/schemas/Message"

    Message:
      type: object
      properties:
        role:
          type: string
          description: Sender role, one of "user", "assistant", or "tool".
          example: "user"
        content:
          type: string
          description: The message text.
